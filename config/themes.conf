# nexyth themes
# Preview with %, move with Up/Down (or j/k), Enter saves, Escape cancels.
# Each theme sets the same seven color settings used by config/default.conf.

theme "Default"
set foreground #d4d4d4
set background #1e1e1e
set status-foreground #d4d4d4
set status-background #2d2d2d
set border #585858
