# nexyth - every key binding and its action is defined here.
# Copy this file to ~/.config/nexyth/config and edit it freely.
# Syntax: set <name> <value>
#         bind <mode|all> <keys> <action> [args]
#         unbind <mode> <keys>
#         define <name> <action> [; <action> ...]
# Key names: <C-w>, <M-x>, <Esc>, <C-Esc>, <CR>, <Tab>, <Space>, <Up>, <F1>, <Leader>...
# A key sequence is just keys concatenated: gt, gg, <C-w>s, <Leader>t.

set shell /bin/bash
set leader <C-b>
set tabbar false
set statusline true
set scrollback 20000
set resize-step 5

set foreground #dddddd
set background #000000
set status-foreground #ffffff
set status-background #333333
set border #444444
set focus-border #888888
set selection #333333

# Config-defined commands (actions chained with ';').
define clear-terminal send-keys "clear\n"
define new-log-tab new-tab ; send-keys "tail -f /var/log/syslog\n"

# ---------------------------------------------------------------- PLEX ---
# -- entering NORMAL (like vim's i/a/I/A)
bind plex i normal
bind plex a normal
bind plex I normal-home
bind plex A normal-end
bind plex <Leader>i normal
bind plex <Insert> normal

# -- leaving NORMAL / VISUAL
bind plex <Esc> plex
bind plex ? help
bind plex gt tab-list
bind plex % theme-list
bind plex <Leader>+ clock
bind all <F1> help
bind all <Leader>? help

# -- focus movement (hjkl + arrows + Ctrl-w prefixes)
bind plex h focus-left
bind plex j focus-down
bind plex k focus-up
bind plex l focus-right
bind plex <Left> focus-left
bind plex <Down> focus-down
bind plex <Up> focus-up
bind plex <Right> focus-right
bind plex <C-w>h focus-left
bind plex <C-w>j focus-down
bind plex <C-w>k focus-up
bind plex <C-w>l focus-right
bind plex w focus-next
bind plex W focus-previous
bind plex <C-w>w focus-next
bind plex <C-w>W focus-previous

# -- splitting panes (vim :split / :vsplit and <Leader>| / <Leader>-)
bind plex s split-horizontal
bind plex <C-w>s split-horizontal
bind plex <Leader>-            split-pane-horizontal
bind plex <Leader>_            split-horizontal
bind plex <C-w>v split-vertical
bind plex <C-w>V split-vertical
bind plex <Leader>| split-vertical
bind plex <Leader>\ split-pane-vertical

# -- closing panes
bind plex x close-pane
bind plex <C-w>x close-pane
bind plex <C-w>c close-pane

# -- tabs
bind plex c new-tab
bind plex t new-tab
bind plex <Leader>t new-tab
bind plex <Leader>c close-tab
bind plex <Leader>r rename-tab
bind plex <C-w>t new-tab
bind plex <Tab> tab-next
bind plex gT tab-prev
bind plex 1 tab-select 1
bind plex 2 tab-select 2
bind plex 3 tab-select 3
bind plex 4 tab-select 4
bind plex 5 tab-select 5
bind plex 6 tab-select 6
bind plex 7 tab-select 7
bind plex 8 tab-select 8
bind plex 9 tab-select 9

# -- resizing panes (H/J/K/L mirror vim's window resizing)
bind plex r resize-mode
bind plex H resize-left
bind plex J resize-down
bind plex K resize-up
bind plex L resize-right
bind plex <C-w>H resize-left
bind plex <C-w>J resize-down
bind plex <C-w>K resize-up
bind plex <C-w>L resize-right
bind plex <C-w>= resize-equal
bind plex <Leader>= resize-equal
bind plex z zoom-toggle
bind plex <Leader>z zoom-toggle
bind plex <C-w>z zoom-toggle

# -- scrollback (no copy mode needed for simple reading)
bind plex <C-u> scroll-up 5
bind plex <C-d> scroll-down 5
bind plex <C-f> scroll-down 5
bind plex gg scroll-top
bind plex G scroll-bottom

# -- selecting / copying / pasting within the focused panel
bind plex v visual
bind plex <Leader>v visual
bind plex y yank
bind plex Y yank-line
bind plex p paste
bind plex <Leader>p paste
bind plex <Leader>l clear-terminal
bind plex <Leader>n new-log-tab

# -- leaving nexyth
bind plex q quit
bind plex <C-q> quit
bind plex <Leader>q quit

# ---------------------------------------------------------------- NORMAL ---
# Everything not bound here is sent straight to the panel's shell.
bind normal <C-Esc>            plex
bind normal <C-b>              plex

# ---------------------------------------------------------------- VISUAL ---
# Vim-style selection inside the panel; y sends to the clipboard via OSC52.
bind visual <Esc> plex
bind visual v plex
bind visual <C-c> plex
bind visual h move-left
bind visual j move-down
bind visual k move-up
bind visual l move-right
bind visual <Left> move-left
bind visual <Down> move-down
bind visual <Up> move-up
bind visual <Right> move-right
bind visual w move-word-forward
bind visual b move-word-backward
bind visual 0 move-line-start
bind visual $ move-line-end
bind visual gg move-top
bind visual G move-bottom
bind visual <Space> select-here
bind visual y yank
bind visual Y yank-line
bind visual <C-y> yank
bind visual p paste
